[package]
name = "fc-rusty"
version = "0.0.1"
rust-version= "1.85.0"
edition = "2024"
license = "MIT"

[lib]
name = "fc_rusty"
path = "src/lib.rs"

[[bin]]
name = "fc-firmware"
path = "src/main.rs"
required-features = ["firmware"]

[[example]]
name = "sim_hover"
path = "examples/sim_hover.rs"
required-features = []

[[example]]
name = "sim_mpc_hover"
path = "examples/sim_mpc_hover.rs"
required-features = []

[[example]]
name = "sim_kf_hover"
path = "examples/sim_kf_hover.rs"
required-features = []

[[example]]
name = "sim_gps_rescue"
path = "examples/sim_gps_rescue.rs"
required-features = []

# ---- Features ----
# "firmware" pulls in all Embassy/Cortex-M/defmt deps for the embedded binary.
# Disable it (--no-default-features) to build the library and sim examples
# on the host for desktop simulation.

[features]
default = ["firmware"]
firmware = [
    "dep:embassy-executor",
    "dep:embassy-stm32",
    "dep:embassy-time",
    "dep:embassy-sync",
    "dep:embassy-futures",
    "dep:cortex-m",
    "dep:cortex-m-rt",
    "dep:defmt",
    "dep:critical-section",
    "dep:panic-probe",
    "dep:static_cell",
]

# Bench motor-test firmware (see docs/superpowers/specs/2026-06-21-dshot-motor-test-design.md).
# Adds to the default set, so `cargo build --release --features motor-test`
# keeps `firmware` on. No extra deps of its own.
motor-test = []

# Bench-only self-test for the persist flash store (sub-project A).
# On boot: logs the pre-write read, then writes a known marker Config.
# Power-cycle and re-flash-free reboot should then read the marker back,
# proving persistence. Never enable for a flight build.
persist-selftest = []

# ---- Always-available dependencies ----
# These compile for both embedded (no_std) and host (std) targets.

[dependencies]
# Math
nalgebra = { version = "0.34", default-features = false, features = ["libm"] }
libm = "0.2"

# MPC solver.
# Was a path dep on `src/control/tinympc-rs`, but that path is a gitlink
# (mode 160000, commit c3b3980) with no `.gitmodules` entry, so it can never
# be checked out — the directory is empty in every clone. Use the published
# crate instead. Its `std` feature is opt-in (`default = []`), so this is
# already a no_std build.
tinympc-rs = "0.2.0"

# ---- Firmware-only dependencies (optional) ----
# Pulled in by the "firmware" feature. All marked optional = true.

# Embassy executor — runs our async tasks
embassy-executor = { version = "0.9", optional = true, features = [
    "arch-cortex-m",
    "executor-thread",
    "executor-interrupt",
    "defmt",
] }
# Embassy STM32 HAL
embassy-stm32 = { version = "0.4", optional = true, features = [
    "stm32h743vi",
    "memory-x",
    "time-driver-tim5",
    "exti",
    "defmt",
    "unstable-pac",
] }
# Embassy time
embassy-time = { version = "0.5", optional = true, features = [
    "defmt",
    "defmt-timestamp-uptime",
    "tick-hz-32_768",
] }
# Embassy sync
embassy-sync = { version = "0.7", optional = true, features = ["defmt"] }
# Embassy futures
embassy-futures = { version = "0.1", optional = true }

# Cortex-M support
cortex-m = { version = "0.7", optional = true, features = [
    "inline-asm",
    "critical-section-single-core",
] }
cortex-m-rt = { version = "0.7", optional = true }

# Debugging / logging
defmt = { version = "0.3", optional = true }
# `critical-section` provides a portable way to disable interrupts
# around the defmt logger's encoder state (used in src/logger.rs).
critical-section = { version = "1.1", optional = true }
panic-probe = { version = "0.3", optional = true, features = ["print-defmt"] }

# Static allocation
static_cell = { version = "2", optional = true }

# ---- Build profiles ----

[profile.dev]
opt-level = "s"
debug = 2
strip="debuginfo"
lto="fat"

[profile.release]
opt-level = 3
debug = 2
lto = "fat"
codegen-units = 1
