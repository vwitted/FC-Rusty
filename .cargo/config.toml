# .cargo/config.toml
#
# This tells cargo:
#   1. What CPU architecture to compile for (thumbv7em-none-eabihf)
#   2. How to flash and run the firmware
#
# thumbv7em-none-eabihf breakdown:
#   thumbv7em = ARMv7E-M (Cortex-M4/M7)
#   none      = no OS (bare metal)
#   eabihf    = hardware floating point (the F722 has an FPv5-SP FPU)
#
# Flashing on the SpeedyBee F7 V3:
#   The board exposes no SWD pads, so `probe-rs run` will fail unless
#   you solder leads onto the bare pads under the MCU. The intended
#   flow is USB DFU:
#     1. Hold BOOT while plugging USB-C → board enumerates as DFU
#        (lsusb shows 0483:df11 "STM Device in DFU Mode")
#     2. `scripts/flash-dfu.sh`   (builds release + objcopy + dfu-util)
#
# One-off per machine:
#     rustup component add llvm-tools
#     cargo install cargo-binutils
#     sudo apt install dfu-util       # or brew install dfu-util
#
# The runner below is kept for anyone who does wire up SWD; the `chip`
# name is correct for F722RET6 so `probe-rs attach` / chip recognition
# still works.

[target.'cfg(all(target_arch = "arm", target_os = "none"))']
runner = "probe-rs run --chip STM32F722RETx"

[build]
target = "thumbv7em-none-eabihf"

[env]
# Controls which log levels defmt actually emits.
# "trace" = everything, "info" = normal, "warn" = quiet
# Set to "info" once things are working to reduce log traffic.
DEFMT_LOG = "info"
